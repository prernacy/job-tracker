<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Job Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow p-4">
            <h4 class="mb-3">Edit Job Application</h4>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Company Name</label>
                    <input type="text" name="company" class="form-control" value="{{ job.company }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Job Role</label>
                    <input type="text" name="role" class="form-control" value="{{ job.role }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select" required>
                        <option value="Applied" {% if job.status == 'Applied' %}selected{% endif %}>Applied</option>
                        <option value="Interviewing" {% if job.status == 'Interviewing' %}selected{% endif %}>Interviewing</option>
                        <option value="Offer" {% if job.status == 'Offer' %}selected{% endif %}>Offer</option>
                        <option value="Rejected" {% if job.status == 'Rejected' %}selected{% endif %}>Rejected</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Date Applied</label>
                    <input type="date" name="date_applied" class="form-control" value="{{ job.date_applied }}" required>
                </div>
                <button type="submit" class="btn btn-success w-100 mb-2">Update Application</button>
                <a href="/" class="btn btn-secondary w-100">Cancel</a>
            </form>
        </div>
    </div>
</body>
</html>
